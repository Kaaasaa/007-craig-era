<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="007 // Daniel Craig Era (2006–2021) — A Cinematic Digital Exhibition">
  <title>007 // 丹尼尔·克雷格时代影展 (2006–2021)</title>

  <!-- Inline SVG Favicon (Matte Charcoal with Silver 007 Badge) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111111'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23eae6df' font-family='monospace' font-weight='700' font-size='13' letter-spacing='-0.5'%3E007%3C/text%3E%3C/svg%3E">

  <!-- Google Fonts: Cormorant Garamond, Noto Serif SC, Inter, Noto Sans SC, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Core Design System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-noir">

  <!-- 35mm Film Grain Texture & Atmospheric Vignette -->
  <div class="film-grain" aria-hidden="true"></div>
  <div class="film-vignette" aria-hidden="true"></div>

  <!-- Minimalist Top Navigation Bar -->
  <header class="site-header" id="site-header">
    <div class="nav-inner">
      <div class="nav-brand">
        <button id="nav-home-btn" type="button" class="nav-logo-btn" aria-label="Back to Top">
          <img src="assets/007-logo.png" alt="007" class="nav-007-logo" />
        </button>
      </div>

      <div class="nav-controls">
        <!-- Frameless Icon-Only Audio Toggle + Auto-Collapsing 5-Step Gain Scale -->
        <div class="master-audio-control" id="master-audio-control">
          <button type="button" class="sound-toggle-btn" id="global-sound-btn" aria-pressed="false" aria-label="Toggle ambient soundtrack">
            <svg class="sound-icon sound-icon-off" viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="8.5 3.5 4.2 6.8 1.5 6.8 1.5 11.2 4.2 11.2 8.5 14.5 8.5 3.5"></polygon>
              <line x1="12" y1="6.5" x2="16.5" y2="11.5"></line>
              <line x1="16.5" y1="6.5" x2="12" y2="11.5"></line>
            </svg>
            <svg class="sound-icon sound-icon-on" viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="8.5 3.5 4.2 6.8 1.5 6.8 1.5 11.2 4.2 11.2 8.5 14.5 8.5 3.5"></polygon>
              <path d="M11.4 6.4a3.6 3.6 0 0 1 0 5.2"></path>
              <path d="M13.8 4.2a6.6 6.6 0 0 1 0 9.6"></path>
            </svg>
          </button>

          <!-- 5-Step Precision Gain Meter (Collapsed by default, 300ms auto-collapse) -->
          <div class="gain-meter-wrap" id="audio-gain-meter" role="slider" tabindex="0" aria-label="Master Volume" aria-valuemin="20" aria-valuemax="100" aria-valuenow="30">
            <span class="gain-bar" data-level="0.2" style="height: 6px;"></span>
            <span class="gain-bar" data-level="0.4" style="height: 8px;"></span>
            <span class="gain-bar" data-level="0.6" style="height: 10px;"></span>
            <span class="gain-bar" data-level="0.8" style="height: 12px;"></span>
            <span class="gain-bar" data-level="1.0" style="height: 14px;"></span>
          </div>
        </div>

        <!-- Bilingual Engine Toggle -->
        <div class="lang-switcher" role="group" aria-label="Language Selector">
          <button type="button" class="lang-btn" data-lang="en" id="lang-btn-en" aria-label="Switch to English">EN</button>
          <span class="lang-sep" aria-hidden="true">/</span>
          <button type="button" class="lang-btn active" data-lang="zh" id="lang-btn-zh" aria-label="切换至中文">中文</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main id="main-content">

    <!-- Section 1: Hero / Prologue (Decluttered Editorial Opening) -->
    <section class="hero-section" id="hero" aria-labelledby="hero-main-title">
      <div class="hero-inner container-editorial">
        <!-- Centerpiece Typography -->
        <div class="hero-centerpiece">
          <h1 class="hero-title" id="hero-main-title"></h1>
          <div class="hero-title-zh" id="hero-title-translation"></div>
          <div class="hero-subtitle" id="hero-subtitle"></div>
          <p class="hero-lead" id="hero-lead"></p>
        </div>

        <!-- Bottom Minimal Scroll Indicator -->
        <div class="hero-scroll-cue">
          <div class="scroll-track" aria-hidden="true">
            <span class="scroll-pin"></span>
          </div>
          <div class="scroll-text-group">
            <span class="mono-cue" id="hero-scroll-prompt"></span>
            <span class="scroll-sub" id="hero-scroll-hint"></span>
          </div>
        </div>
      </div>

      <!-- Hero Right-Hand Daniel Craig Silhouette with Cinema Noir Glow -->
      <div class="hero-silhouette-wrap" aria-hidden="true">
        <div class="hero-silhouette-glow"></div>
        <img 
          src="assets/bond-hero.png" 
          alt="Daniel Craig 007 Silhouette" 
          class="hero-silhouette-img"
          loading="eager"
          decoding="async"
        />
      </div>
    </section>

    <!-- Section 2: Core Visual Highlight - Full-Bleed Cinema Stage with Triple Vignette -->
    <section class="one-shot-stage" id="one-shot-stage" data-act="0" aria-label="Full-Bleed Cinema Exhibition">
      
      <!-- Layer 1: Full-Viewport Cinema Stage & Triple Cinematic Vignette Overlay (z-index: 1) -->
      <div class="cinema-viewport" id="cinema-viewport" aria-hidden="true">
        <div class="stage-layer stage-backdrops" id="stage-backdrops">
          <div class="act-bg act-bg-1 active" data-act-index="0">
            <div class="act-ambient-gradient bg-casino"></div>
            <div class="act-backdrop"></div>
          </div>
          <div class="act-bg act-bg-2" data-act-index="1">
            <div class="act-ambient-gradient bg-quantum"></div>
            <div class="act-backdrop"></div>
          </div>
          <div class="act-bg act-bg-3" data-act-index="2">
            <div class="act-ambient-gradient bg-skyfall"></div>
            <div class="skyfall-rain" aria-hidden="true"></div>
            <div class="act-backdrop"></div>
          </div>
          <div class="act-bg act-bg-4" data-act-index="3">
            <div class="act-ambient-gradient bg-spectre"></div>
            <div class="act-backdrop"></div>
          </div>
          <div class="act-bg act-bg-5" data-act-index="4">
            <div class="act-ambient-gradient bg-notimetodie"></div>
            <div class="act-backdrop"></div>
          </div>
        </div>
        <div class="cinema-vignette" aria-hidden="true"></div>
      </div>

      <!-- Layer 4: L2/L3 Centered Bottom Two-Line Typography & Crosshair Dossier Easter Egg (z-index: 9) -->
      <div class="stage-layer stage-hud-layer">
        <!-- Bottom Centered L2 (Title) + L3 (Iconic Quote) -->
        <div class="hud-subtitles-bar">
          <div class="hud-subtitles-content" id="hud-subtitles-content">
            <!-- L2: High-Contrast Serif Film Title -->
            <h2 class="hud-film-title" id="hud-film-title">CASINO ROYALE</h2>
            <!-- L3: Iconic Single-Line Quote -->
            <blockquote class="hud-quote" id="hud-quote">
              <p id="hud-quote-text">“我叫邦德。詹姆斯·邦德。”</p>
            </blockquote>
          </div>
        </div>

        <!-- Subtle Precision Crosshair (+) Dossier Easter Egg (Bottom-Right) -->
        <div class="stage-dossier-widget" id="stage-dossier-widget">
          <div class="dossier-popover" id="dossier-popover" role="region" aria-hidden="true" aria-label="Chapter Archival Notes">
            <div class="dossier-row">
              <span class="dossier-key" id="dossier-label-director">导演</span>
              <span class="dossier-val" id="dossier-val-director">Martin Campbell</span>
            </div>
            <div class="dossier-row">
              <span class="dossier-key" id="dossier-label-location">摄影与取景</span>
              <span class="dossier-val" id="dossier-val-location">巴哈马 · 黑山 · 威尼斯 / Phil Méheux</span>
            </div>
            <div class="dossier-row">
              <span class="dossier-key" id="dossier-label-gear">标志器物</span>
              <span class="dossier-val" id="dossier-val-gear">Aston Martin DBS · Omega Seamaster 300M</span>
            </div>
          </div>

          <button type="button" class="dossier-crosshair-btn" id="dossier-crosshair-btn" aria-expanded="false" aria-controls="dossier-popover" aria-label="展开或收起当前章节档案参数">
            <svg class="crosshair-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke-opacity="0.35"></circle>
              <line x1="12" y1="6" x2="12" y2="18"></line>
              <line x1="6" y1="12" x2="18" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Layer 5: Mechanical Watch-Bezel Vernier Scale Ruler (Right Edge, z-index: 10) -->
      <nav class="stage-layer stage-ruler" id="stage-ruler" aria-label="Chronology Vernier Scale">
        <div class="vernier-scale-wrap">
          <!-- 21-Tick Precision SVG Scale (Major ticks at y=12, 66, 120, 174, 228) -->
          <svg class="vernier-svg" viewBox="0 0 32 240" width="32" height="240" fill="none" aria-hidden="true">
            <!-- Vertical Spine -->
            <line x1="27" y1="12" x2="27" y2="228" stroke="rgba(234, 230, 223, 0.14)" stroke-width="0.75" />
            <!-- Minor & Major Mechanical Ticks (21 marks total, 5 major) -->
            <g class="vernier-minor-ticks" stroke="rgba(234, 230, 223, 0.22)" stroke-width="0.75">
              <line x1="21" y1="22.8" x2="27" y2="22.8" />
              <line x1="21" y1="33.6" x2="27" y2="33.6" />
              <line x1="21" y1="44.4" x2="27" y2="44.4" />
              <line x1="21" y1="55.2" x2="27" y2="55.2" />

              <line x1="21" y1="76.8" x2="27" y2="76.8" />
              <line x1="21" y1="87.6" x2="27" y2="87.6" />
              <line x1="21" y1="98.4" x2="27" y2="98.4" />
              <line x1="21" y1="109.2" x2="27" y2="109.2" />

              <line x1="21" y1="130.8" x2="27" y2="130.8" />
              <line x1="21" y1="141.6" x2="27" y2="141.6" />
              <line x1="21" y1="152.4" x2="27" y2="152.4" />
              <line x1="21" y1="163.2" x2="27" y2="163.2" />

              <line x1="21" y1="184.8" x2="27" y2="184.8" />
              <line x1="21" y1="195.6" x2="27" y2="195.6" />
              <line x1="21" y1="206.4" x2="27" y2="206.4" />
              <line x1="21" y1="217.2" x2="27" y2="217.2" />
            </g>
            <!-- Major Film Ticks -->
            <g class="vernier-major-ticks">
              <line class="vernier-major-tick active" data-act-index="0" x1="15" y1="12" x2="27" y2="12" />
              <line class="vernier-major-tick" data-act-index="1" x1="15" y1="66" x2="27" y2="66" />
              <line class="vernier-major-tick" data-act-index="2" x1="15" y1="120" x2="27" y2="120" />
              <line class="vernier-major-tick" data-act-index="3" x1="15" y1="174" x2="27" y2="174" />
              <line class="vernier-major-tick" data-act-index="4" x1="15" y1="228" x2="27" y2="228" />
            </g>
          </svg>

          <!-- Interactive Vernier Milestones (Only Active Year Appears) -->
          <ul class="ruler-milestones">
            <li>
              <button type="button" class="ruler-node active" data-act-index="0" data-year="2006" aria-label="Jump to Casino Royale (2006)">
                <span class="ruler-year">2006</span>
                <span class="ruler-tick-hit" aria-hidden="true"></span>
              </button>
            </li>
            <li>
              <button type="button" class="ruler-node" data-act-index="1" data-year="2008" aria-label="Jump to Quantum of Solace (2008)">
                <span class="ruler-year">2008</span>
                <span class="ruler-tick-hit" aria-hidden="true"></span>
              </button>
            </li>
            <li>
              <button type="button" class="ruler-node" data-act-index="2" data-year="2012" aria-label="Jump to Skyfall (2012)">
                <span class="ruler-year">2012</span>
                <span class="ruler-tick-hit" aria-hidden="true"></span>
              </button>
            </li>
            <li>
              <button type="button" class="ruler-node" data-act-index="3" data-year="2015" aria-label="Jump to Spectre (2015)">
                <span class="ruler-year">2015</span>
                <span class="ruler-tick-hit" aria-hidden="true"></span>
              </button>
            </li>
            <li>
              <button type="button" class="ruler-node" data-act-index="4" data-year="2021" aria-label="Jump to No Time to Die (2021)">
                <span class="ruler-year">2021</span>
                <span class="ruler-tick-hit" aria-hidden="true"></span>
              </button>
            </li>
          </ul>
        </div>
      </nav>

    </section>

    <!-- Section 3: Q-Branch & Bespoke Tailoring (Interactive Darkroom Gallery) -->
    <section class="archive-section darkroom-section" id="artifacts" aria-labelledby="artifacts-title">
      <div class="container-editorial">
        <!-- Minimal Section Header (No Subtitle Paragraph) -->
        <header class="section-header section-header--minimal">
          <div class="section-meta-strip">
            <span class="section-index" id="artifacts-section-idx">01</span>
            <span class="section-sep" aria-hidden="true">/</span>
            <span class="section-category" id="artifacts-section-cat"></span>
          </div>
          <h2 class="section-title" id="artifacts-title"></h2>
        </header>

        <!-- Asymmetric Darkroom Interactive Gallery -->
        <div class="darkroom-gallery" id="artifacts-grid-container">
          <!-- Dynamically populated by app.js from SITE_DATA.artifacts -->
        </div>
      </div>
    </section>

    <!-- Section 4: The Sonic Legacy (Theme Songs Chronology) -->
    <section class="archive-section" id="soundtracks" aria-labelledby="soundtracks-title">
      <div class="container-editorial">
        <!-- Section Header -->
        <header class="section-header">
          <div class="section-meta-strip">
            <span class="section-index" id="soundtracks-section-idx">02</span>
            <span class="section-sep" aria-hidden="true">/</span>
            <span class="section-category" id="soundtracks-section-cat"></span>
          </div>
          <h2 class="section-title" id="soundtracks-title"></h2>
          <p class="section-subtitle" id="soundtracks-subtitle"></p>
        </header>

        <!-- Minimal Editorial Track Catalog -->
        <div class="soundtrack-catalog" id="soundtracks-container">
          <!-- Dynamically populated by app.js from SITE_DATA.soundtracks -->
        </div>
      </div>
    </section>

  </main>

  <!-- Section 5: Cinematic Curtain Call (Final Blackout Tribute) -->
  <footer class="curtain-call" id="curtain-call">
    <div class="container-editorial curtain-inner">
      <div class="curtain-center">
        <blockquote class="curtain-quote" id="curtain-quote">“We have all the time in the world.”</blockquote>
        <p class="curtain-quote-zh" id="curtain-quote-zh">我们拥有世间所有的时间</p>
        <div class="curtain-era-mark" id="curtain-era-mark">2006 — 2021 · FIN</div>

        <button type="button" class="curtain-top-btn" id="back-to-top" aria-label="返回页面顶部">
          <svg class="curtain-arrow-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <polyline points="6 10 12 4 18 10"></polyline>
          </svg>
        </button>
      </div>

      <div class="curtain-credit" id="curtain-credit">CURATED BY HN STUDIO</div>
    </div>
  </footer>

  <!-- GSAP 3 & ScrollTrigger Libraries via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

  <!-- Data Layer, Offline Base64 SFX & Application Engine -->
  <script src="data.js"></script>
  <script src="sfx-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
